# Rolling statusline animation — tune freely, no script edits needed.
# Reloaded on every statusline render, so changes apply on your next prompt.

# Master on/off switch for the whole animation segment.
ANIM_ENABLED=true

# Which animation to play. Add new ones in statusline-command.sh's
# render_animation() dispatcher and point ANIM_NAME at the new case.
ANIM_NAME=xwing_deathstar

# --- Sequence ------------------------------------------------------------
# The ship crawls in from the left, sits at the start of the track for
# ANIM_SHOT_DELAY_MS, then fires. The laser then races ahead of the ship
# (independently, much faster) toward the death star. Once the laser
# reaches it, the death star explodes. Only then does the ship — wherever
# it happens to be on the track at that moment, since it's much slower than
# the laser — kick into fast mode and flee off-screen.

# --- Timing -------------------------------------------------------------
# Track length in cells between the ship's start and the death star.
ANIM_WIDTH=1000
# Open-space margin past the death star, as a percentage of ANIM_WIDTH, for
# extra room and stars, and for the ship to fully clear before it's
# considered off-screen. Twinkles with the same starfield as the main track.
ANIM_MARGIN_PCT=50
# Milliseconds per animation tick — lower is faster (background twinkle
# speed is one tick each; the knobs below scale everything else off this).
ANIM_FRAME_MS=250
# Ticks the ship dwells in each track cell during its approach — raise to
# make the ship's crawl slower, lower to speed it up.
ANIM_SHIP_TICKS_PER_CELL=4
# Milliseconds the ship sits at the start of the track before firing —
# given in ms (not ticks) so it stays "~1 second" regardless of ANIM_FRAME_MS.
ANIM_SHOT_DELAY_MS=1000
# Ticks the laser dwells in each track cell as it races toward the death
# star — this is independent of the ship's speed. 1 is fastest.
ANIM_LASER_TICKS_PER_CELL=1
# Ticks the explosion holds before the ship's getaway starts. Kept wide
# (~3s worth) so a ~1s-cadence statusline refresh can't step over it entirely.
ANIM_EXPLOSION_FRAMES=16
# Ticks each explosion sprite frame (ANIM_EXPLOSION_CHARS below) holds
# before advancing to the next, cycling through in order.
ANIM_EXPLOSION_FRAME_TICKS=4
# Getaway speed as a percentage of 1 cell/tick (the previous fastest speed),
# so >100 makes the ship faster than it ever otherwise moves. 130 = 30% faster.
ANIM_FLEE_SPEED_PCT=200
# Blank ticks after the ship clears the screen before the next pass starts.
# Also kept wide for the same statusline-refresh-cadence reason as above.
ANIM_PAUSE_FRAMES=10

# --- Glyphs (mix of emoji and Nerd Font icons — override freely) --------
# All given as \u/\U escapes rather than pasted literal characters: private-
# use and supplementary-plane glyphs can silently get mangled when pasted
# as raw bytes through some text pipelines, but a plain-ASCII escape is
# immune to that — bash resolves it to the real glyph only when sourced.
# nf-fa-fighter_jet (U+F0FB) — stand-in for the X-wing.
ANIM_SHIP=$'\uf0fb'
# nf-md-death_star (U+F08D8, Nerd Fonts v3+/Material Design Icons).
ANIM_TARGET=$'\U000f08d8'
# nf-fa icons cycled for the laser's traveling sprite, one per
# ANIM_LASER_SPRITE_MS milliseconds \u2014 kept as its own ms-based knob (not
# tied to ANIM_FRAME_MS) since the statusline is only actually polled every
# ~1s: a short cycle length sampled at an exact multiple of ANIM_FRAME_MS
# can alias onto the same frame forever. Avoid values that evenly divide
# 1000 (e.g. 100, 125, 200, 250, 500) or you can reintroduce that.
ANIM_LASER_CHARS=($'\uf48b' $'\uf469')
ANIM_LASER_SPRITE_MS=120
# Explosion sprite sequence, played in order (ANIM_EXPLOSION_FRAME_TICKS
# per frame): a Font Awesome icon, the collision-symbol emoji, two
# Material Design Icons, and a Font Awesome icon.
ANIM_EXPLOSION_CHARS=($'\uf1d1' $'\U0001f4a5' $'\uf1e9' $'\U000f08da')
# Background starfield: one of these characters is picked per empty cell
# per tick, so stars pop in and out as the ship and laser cross. Tune the
# mix by changing how many of each character appear here — spaces mean "no
# star this tick", repeat '·' or '*' to make stars more common.
ANIM_BG_CHARS='     · ·  *   '

# --- Colors (standard ANSI codes, override with any \033[...m sequence) -
ANIM_SHIP_COLOR=$'\033[97m'
ANIM_LASER_COLOR=$'\033[91m'
ANIM_TARGET_COLOR=$'\033[37m'
